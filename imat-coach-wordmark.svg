      <path d="M309 131 L309 205" stroke="url(#blue)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="309" cy="215" r="9" fill="#D8B55C"/>
      <!-- subtle medical cross -->
      <rect x="177" y="235" width="46" height="72" rx="8" fill="#FFFFFF"/>
      <rect x="154" y="258" width="92" height="26" rx="8" fill="#FFFFFF"/>
      <rect x="186" y="244" width="28" height="54" rx="5" fill="#173D65"/>
      <rect x="173" y="257" width="54" height="28" rx="5" fill="#173D65"/>
      <!-- Italy accent -->
      <rect x="90" y="337" width="72" height="8" rx="4" fill="#16834B"/>
      <rect x="162" y="337" width="72" height="8" rx="4" fill="#F2F2F2"/>
      <rect x="234" y="337" width="72" height="8" rx="4" fill="#D4483E"/>
    </g>

    <!-- Wordmark -->
    <g transform="translate(405,110)">
      <text x="0" y="82" font-family="DejaVu Sans, Arial, sans-serif" font-size="112"
            font-weight="800" fill="url(#blue)" letter-spacing="-4">IMAT</text>
      <text x="325" y="82" font-family="DejaVu Sans, Arial, sans-serif" font-size="112"
            font-weight="500" fill="#315579" letter-spacing="-3">Coach</text>
      <rect x="2" y="114" width="685" height="6" rx="3" fill="#D8B55C"/>
      <text x="4" y="166" font-family="DejaVu Sans, Arial, sans-serif" font-size="34"
