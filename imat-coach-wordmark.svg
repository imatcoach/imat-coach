<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#153B63"/>
      <stop offset="100%" stop-color="#0C2744"/>
    </linearGradient>
  </defs>
  <g transform="translate(45,45)">
    <!-- Icon -->
    <g transform="translate(0,15)">
      <!-- open book -->
      <path d="M55 260 C90 220,145 212,200 232 L200 318 C145 294,95 294,55 320 Z"
