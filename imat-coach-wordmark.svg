      <path d="M200 232 C255 212,310 220,345 260 L345 320 C305 294,255 294,200 318 Z"
            fill="none" stroke="url(#blue)" stroke-width="14" stroke-linejoin="round"/>
      <!-- graduation cap -->
      <path d="M90 130 L200 75 L310 130 L200 185 Z" fill="url(#blue)"/>
      <path d="M125 148 L125 200 C167 223,233 223,275 200 L275 148"
